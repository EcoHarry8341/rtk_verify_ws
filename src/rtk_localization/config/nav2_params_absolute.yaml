# ==============================================================================
#  农业大棚专用 Nav2 满血版参数配置文件 (Jazzy / Humble 商业级通用版)
#  目标底盘: AgileX Ranger Mini 3.0 Pro (双阿克曼运动学模型)
#  核心策略: 剥离 AMCL 定位权、挂载 Smac 混合 A*、RPP 纯追踪、3D 体素局部防死角避障
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    # 核心阉割：彻底关闭 AMCL 的 TF 广播，腾出发布权交给我们的 Global EKF
    tf_broadcast: false
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"

# ==============================================================================
#  控制器中枢 (Controller Server) —— 局部路径跟随
# ==============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5   # 限制横移偏好，强迫车辆顺应阿克曼平滑转向
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 路径检查器：防止打滑或被铁丝卡住时原地无限空转
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    # 终点精度检查
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15       # 允许 15cm 的绝对到点误差（大棚内泥地容错）
      yaw_goal_tolerance: 0.08      # 允许约 4.5 度的偏航误差

    # 🌟 针对阿克曼底盘最完美的局部控制器：Regulated Pure Pursuit (纯追踪)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller/RegulatedPurePursuitController"
      desired_linear_vel: 0.55      # 期望最高前进速度 (m/s)
      lookahead_dist: 0.6           # 基础预瞄距离 (米)
      min_lookahead_dist: 0.3       # 最小预瞄距离 (低速、狭窄过道防止盲切内侧)
      max_lookahead_dist: 0.9       # 最大预瞄距离 (开阔地全速冲刺)
      lookahead_time: 1.5           # 动态预瞄时间因子 (当前速度 * 1.5)
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      
      # 减速调节：拐死弯、接近障碍物时，自动线性压低前进车速，极度安全
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6   # 当弯道半径小于 0.6 米时触发减速
      regulated_linear_scaling_min_speed: 0.15    # 弯道最低保底前进速度
      
      # 碰撞预防：如果在预瞄线上前方 2.0 秒后将发生碰撞，小车会平滑减速直到刹停
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

# ==============================================================================
#  规划器中枢 (Planner Server) —— 全局路径生成
# ==============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    # 🌟 阿克曼底盘唯一的全局救星：Smac Planner 混合 A* 算法
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      allow_unknown: true           # 允许全局路径穿越未探测的未知区域
      max_iterations: 1000000       # 算力全开上限
      max_on_approach_iterations: 1000
      max_planning_time: 2.0        # 单次规划超时硬限制 (秒)
      
      # 🚗 核心阿克曼物理约束（让你的车像汽车一样拐弯，绝不画直角）
      minimum_turning_radius: 0.45  # 结合 Ranger mini 轮距，锁死最小转弯半径为 0.45 米！
      motion_model_for_search: "REEDS_SHEPP" # 支持倒车的汽车轨迹模型
      angle_quantization_fac: 72    # 将 360 度打碎为 72 个方向（5度一格，解算精度极高）
      analytic_expansion_ratio: 3.5
      forward_cost: 1.0
      reverse_cost: 2.0             # 惩罚倒车：非必要情况绝不轻易倒车
      change_penalty: 0.1
      non_straight_cost: 1.2
      cost_penalty: 2.0             # 极度讨厌高成本区域，宁可绕远路也绝不刮蹭垄沟

# # ==============================================================================
#  局部代价地图 (Local Costmap) —— 3D 体素局部高精度实时避障
# ==============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom            # 局部代价地图必须基于无跳变的局部里程计
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true          # 代价地图随着车体移动而动态向前滚动
      width: 4.0
      height: 4.0
      resolution: 0.05
      
      # 📐 上下对齐的真实车体 footprint：长 1.1 米，宽 0.75 米
      footprint: "[[-0.55, -0.375], [-0.55, 0.375], [0.55, 0.375], [0.55, -0.375]]"
      plugins: ["voxel_layer", "inflation_layer"]

      # 🌟 3D 体素避障层：生吞 3D 点云，杜绝大棚铁丝、斜拉水管死角
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1           # Z 轴每 10 厘米切一片（共15层）
        z_voxels: 15                # 向上检测 1.5 米高度内的空间
        max_obstacle_height: 1.5    # 忽略 1.5 米以上的雷达噪点（如天棚塑料布）
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /rslidar_points
          max_obstacle_height: 1.5
          min_obstacle_height: 0.15 # 忽略地面 15 厘米以下的水泥反射和杂草
          clearing: true              # 障碍物离开后自动清除图层
          marking: true               # 点云打在物体上时立刻投影为障碍物
          data_type: "PointCloud2"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0    # 膨胀衰减因子
        inflation_radius: 0.4       # 障碍物外围硬膨胀 40 厘米（保证 1.1x0.75 的车身绝对安全）

# ==============================================================================
#  全局代价地图 (Global Costmap) —— 2D 低频大图规划
# ==============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map             # 全局地图必须挂载在具有绝对坐标的 map 坐标系
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: "[[-0.55, -0.375], [-0.55, 0.375], [0.55, 0.375], [0.55, -0.375]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      # 全局避障使用拍扁的 2D 激光，极大省下 RK3588 的 CPU 算力
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ==============================================================================
#  生命周期/行为树中枢 (其内部参数保持官方 Jazzy 标准，防止驱动层面死机报错)
# ==============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::Backup"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    odom_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    default_nav_to_pose_bt_xml: ""
    goal_blacklisted_time: 9.0
    transform_timeout: 0.1
    use_groot_monitoring: true
    groot_pie_port: 1666
    groot_evt_port: 1667
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_backup_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_recovery_checker_bt_node
      - nav2_distance_controller_bt_node
      - nav2_distance_travelled_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_condition_bt_node
      - nav2_is_transformable_condition_bt_node
      - nav2_single_trigger_had_goal_bt_node
      - nav2_clearing_costmap_service_bt_node

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.55, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 8