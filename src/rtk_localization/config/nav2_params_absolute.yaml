# ==============================================================================
#  农业大棚专用 Nav2 满血版参数配置文件 (Jazzy 终极修正版)
#  目标底盘: AgileX Ranger Mini 3.0 Pro (双阿克曼运动学模型)
#  核心策略: 剥离 AMCL 定位权、挂载 Smac 混合 A*、RPP 纯追踪、3D 体素局部防死角避障
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    # 核心阉割：彻底关闭 AMCL 的 TF 广播，腾出发布权交给我们的 Global EKF
    tf_broadcast: false
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    # 【Nav2 Jazzy】设定初始位姿，确保 AMCL 启动时落在地图有效区域内
    set_initial_pose: true
    initial_pose:
      x: -29.0
      y: -25.0
      z: 0.0
      yaw: 0.0

# ==============================================================================
#  控制器中枢 (Controller Server) —— 局部路径跟随
# ==============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.08

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.55
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

# ==============================================================================
#  平滑器中枢 (Smoother Server) —— [Claude 修复项] 配合 BT 节点使用
# ==============================================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ==============================================================================
#  规划器中枢 (Planner Server) —— 全局路径生成
# ==============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      
      # 阿克曼物理约束
      minimum_turning_radius: 0.45
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_fac: 72
      analytic_expansion_ratio: 3.5
      
      # [Claude 修复项] Jazzy 版本参数更名对齐
      reverse_penalty: 2.0             
      change_penalty: 0.1
      non_straight_penalty: 1.2
      cost_penalty: 2.0

# ==============================================================================
#  局部代价地图 (Local Costmap) —— 3D 体素局部高精度实时避障
# ==============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 4      # [已修复为整数]
      height: 4     # [已修复为整数]
      resolution: 0.05
      footprint: "[[-0.55, -0.375], [-0.55, 0.375], [0.55, 0.375], [0.55, -0.375]]"
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 15
        max_obstacle_height: 1.5
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /rslidar_points_nav
          max_obstacle_height: 1.5
          min_obstacle_height: 0.15
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  # 加大衰减系数，让边缘没那么红
        inflation_radius: 0.8   # <=== 从 0.8 暴降到 0.45（贴身距离）

# ==============================================================================
#  全局代价地图 (Global Costmap) —— 2D 低频大图规划
# ==============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      footprint: "[[-0.55, -0.375], [-0.55, 0.375], [0.55, 0.375], [0.55, -0.375]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: /rslidar_points_nav
          max_obstacle_height: 2.0
          min_obstacle_height: 0.15
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 5.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0  # 加大衰减系数
        inflation_radius: 0.8   # <=== 同上，降到 0.45

# ==============================================================================
#  生命周期/行为树中枢
# ==============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    # 🔪 开除 Spin：阿克曼底盘不能原地旋转，只保留 backup + wait
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

# ==============================================================================
#  行为树与生命周期中枢
# ==============================================================================
# ... (上面的 behavior_server 保持不变)

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    odom_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    # 🔪 挂载阿克曼双剧本：单点导航 + 多航点导航
    default_nav_to_pose_bt_xml: "/home/cat/rtk_verify_ws/src/rtk_localization/behavior_trees/ackermann_nav.xml"
    default_nav_through_poses_bt_xml: "/home/cat/rtk_verify_ws/src/rtk_localization/behavior_trees/ackermann_nav_through_poses.xml"
    goal_blacklisted_time: 9.0
    transform_timeout: 0.1
    use_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    
    # 【Jazzy 终极修复点】：声明独立的 Navigator 插件，并清空老版本的全局注册表
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # plugin_lib_names: []  # 必须置空，防止与插件内部的注册机制撞车导致 Fatal

map_server:
  ros__parameters:
    use_sim_time: false

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "amcl"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.55, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ==============================================================================
#  Jazzy 独有防碰撞中枢 (最后一道安全网，连接最终的 cmd_vel)
# ==============================================================================
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"  # 接收平滑器传来的速度
    cmd_vel_out_topic: "cmd_vel"          # 最终踩下真实的油门
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
# 物理急停刹车区：在车身外围画一个 1.3m x 0.9m 的无形护盾
    PolygonStop:
      type: "polygon"
      # 【终极正解】：必须带双引号！必须是二维嵌套数组！把它当成一整句话传给系统！
      points: "[[0.60, 0.45], [0.60, -0.45], [-0.60, -0.45], [-0.60, 0.45]]"
      action_type: "stop"
      visualize: True
      polygon_pub_topic: "polygon_stop"

# 物理急停刹车区：在车身外围画一个 1.3m x 0.9m 的无形护盾

      
    observation_sources: ["pointcloud_source"]
    pointcloud_source:
      type: "pointcloud"
      topic: "/rslidar_points_nav"
      min_height: 0.15
      max_height: 1.5

docking_server:
  ros__parameters:
    use_sim_time: false
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
    controller_frequency: 50.0
    action_server_result_timeout: 10.0
