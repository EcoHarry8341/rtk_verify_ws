slam_toolbox:
  ros__parameters:
    # 坐标系（必须正确，与你的 TF 树一致）
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    
    # 输入话题
    scan_topic: /scan
    
    # 模式
    mode: mapping
    
    # TF 控制（已修复）
    transform_publish_period: 0.0
    
    # 地图更新
    map_update_interval: 2.0
    resolution: 0.05
    
    # 扫描匹配阈值
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 15.0
    
    # 闭环检测
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    
    # 其他
    throttle_scans: 1
    debug_logging: false